units: {length: cm, quantity: mol, activation-energy: cal/mol}

phases:
  - kinetics: gas
    transport: mixture-averaged
    name: gri30-CO-H2-submech
    skip-undeclared-third-bodies: true
    thermo: ideal-gas
    elements: [H, O, C]
    species: [O2, C4H6, CO, CO2, H2O]
    state:
      T: 1.0e-03
      density: 1.0e-03
      Y: {C4H6: 1.0}

species:
- name: C4H6
  composition: {C: 4, H: 6}
  thermo:
    model: NASA7
    temperature-ranges: [200.0, 1000.0, 6000.0]
    data:
    - [4.10599669, 5.05575563e-03, 5.83885454e-05, -8.05950198e-08, 3.27447711e-11,
      1.15092468e+04, 8.42978067]
    - [7.62637466, 0.0172523403, -6.09184911e-06, 9.70800102e-10, -5.76169721e-14,
      9553.06395, -14.8325259]
